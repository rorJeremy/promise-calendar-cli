# golangci-lint v2 configuration. The version is pinned in mise.toml.
version: "2"

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  # Plus two that fizzy-cli also enables: gosec (security) and revive, whose
  # default rules include `exported` and `package-comments` (doc comments on
  # every exported identifier and package).
  enable:
    - gosec
    - revive
  exclusions:
    rules:
      # Tests read temp files (G304), make loose files and directories on
      # purpose (G302, G301), use fake tokens and a password in a URL they
      # reject (G101), and parse a multipart form in an httptest handler
      # without a size limit (G120). fizzy-cli excludes gosec from tests too.
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
